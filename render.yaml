databases:
  - name: nexus-comm-db
    databaseName: nexus_comm
    user: nexus_comm
    plan: free

services:
  - type: web
    name: nexus-comm
    runtime: node
    plan: free
    buildCommand: >
      npm install -g pnpm@10 &&
      pnpm install --frozen-lockfile &&
      pnpm run build:render &&
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/scripts run seed
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-comm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
